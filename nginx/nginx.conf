events {}

http {
    upstream neobank_backend {
        server neobank-green:8080;  # switch to blue when needed
    }

    server {
        listen 80;

        location / {
            proxy_pass http://neobank_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
