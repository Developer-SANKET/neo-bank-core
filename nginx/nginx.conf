events {}

http {
    upstream neobank_backend {
         server 127.0.0.1:8081;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://neobank_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
