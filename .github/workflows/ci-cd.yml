name: NeoBank Zero Downtime CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      -  name: Build with Maven
         run: mvn clean package -DskipTests


      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" \
          | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Push Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest -f backend/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Zero Downtime Deploy (Blue-Green)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/neo-bank-core

            echo "Pull latest image"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest

            echo "Start GREEN environment"
            docker compose -f docker-compose.green.yml up -d

            echo "Waiting for GREEN to be healthy"
            sleep 15
            curl -f http://localhost/actuator/health

            echo "Switch traffic to GREEN"
            docker compose restart nginx

            echo "Stop BLUE environment"
            docker compose -f docker-compose.blue.yml down
