name: NeoBank Zero Downtime CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Docker Login
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Zero Downtime Deploy (Blue-Green)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/neo-bank-core

            echo "Pull latest image"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest

            echo "Start GREEN"
            docker compose -f docker-compose.green.yml up -d

            echo "Wait for GREEN startup"
            sleep 25

            echo "Stop BLUE"
            docker compose -f docker-compose.blue.yml down

            echo "Rename GREEN to BLUE (next cycle)"
            docker rename neobank-green neobank-blue || true
