name: NeoBank Zero Downtime CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: neobank-app
  PLATFORM: linux/amd64

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests
        working-directory: backend

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Zero Downtime Deploy (Blue-Green)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/neo-bank-core

            echo "Pull latest image"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/neobank-app:latest

            echo "Start GREEN environment"
            docker compose -f docker-compose.green.yml up -d

            echo "Wait for GREEN to become healthy"
            sleep 30

            echo "Switch NGINX to GREEN"
            docker compose restart nginx

            echo "Stop BLUE environment"
            docker compose -f docker-compose.blue.yml down

            echo "Deployment completed with ZERO downtime